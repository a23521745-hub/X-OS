name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  lint-and-test:
    name: Lint & testler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Token senkronizasyonu
        run: python3 tools/gen-tokens.py --check
      - name: QML yapısal lint
        run: python3 tools/qml-lint.py
      - name: Test paketi
        env:
          PYTHONUTF8: "1"
        run: |
          set +e
          python3 tools/run_tests.py > /tmp/xos_tests.txt 2>&1
          rc=$?
          set -e
          cat /tmp/xos_tests.txt
          if [ "$rc" -ne 0 ]; then
            joined=$(sed -e 's/%/%%/g' /tmp/xos_tests.txt \
              | awk 'BEGIN{f=1}{if(!f)printf "%%0A"; printf "%s",$0; f=0}')
            echo "::error::TESTS rc=$rc ${joined}"
            exit "$rc"
          fi

  build-shell:
    name: plasmex derlemesi (Debian trixie, Qt6)
    runs-on: ubuntu-24.04
    container: debian:trixie
    needs: lint-and-test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl jq git bash \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
            liblayershellqtinterface-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-shapes \
            qml6-module-qtquick-effects qml6-module-qtquick-window \
            libgl1 libegl1 libglx0 libgl1-mesa-dri libegl-mesa0 \
            libxkbcommon0 libdbus-1-3
      - name: Yapılandır & derle
        env:
          GH_TOKEN: ${{ github.token }}
          XOS_REPO: ${{ github.repository }}
          XOS_LOG_ISSUE: 2
        run: |
          . .github/workflows/xos-log.sh
          set +e
          {
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build -j"$(nproc)"
          } > /tmp/xos_build.txt 2>&1
          rc=$?
          set -e
          echo "--- build çıktısı (rc=$rc) ---"
          tail -n 80 /tmp/xos_build.txt || true
          if [ "$rc" -ne 0 ]; then
            size=$(wc -c < /tmp/xos_build.txt | tr -d ' ')
            echo "::error::META rc=$rc size=$size"
            joined=$(grep -v -e '^/usr/bin/c' -e '^\[' -e '^\s*$' /tmp/xos_build.txt \
              | tail -n 50 | sed -e 's/%/%%/g' \
              | awk 'BEGIN{f=1}{if(!f)printf "%%0A"; printf "%s",$0; f=0}')
            echo "::error::JOINED ${joined}"
            xos_post_log "plasmex build rc=$rc" /tmp/xos_build.txt
            exit "$rc"
          fi
      - name: QML kaynaklarını doğrula (qmllint)
        run: |
          if command -v qmllint >/dev/null 2>&1; then
            qmllint shell/qml/Main.qml shell/qml/PlasmaX/*.qml \
              shell/qml/PlasmaX/components/*.qml shell/qml/PlasmaX/panels/*.qml \
              shell/qml/PlasmaX/services/*.qml || true
          fi
      - name: Smoke test (offscreen, yazılım GL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GH_TOKEN: ${{ github.token }}
          XOS_REPO: ${{ github.repository }}
          XOS_LOG_ISSUE: 2
        run: |
          . .github/workflows/xos-log.sh
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 ./build/plasmex --demo --preview 1280x800 \
            > /tmp/xos_smoke.txt 2>&1
          rc=$?
          set -e
          echo "--- smoke (rc=$rc) ---"
          cat /tmp/xos_smoke.txt || true
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::smoke rc=$rc"
            joined=$(tail -n 30 /tmp/xos_smoke.txt | sed -e 's/%/%%/g' \
              | awk 'BEGIN{f=1}{if(!f)printf "%%0A"; printf "%s",$0; f=0}')
            echo "::error::SMOKE ${joined}"
            xos_post_log "smoke test rc=$rc" /tmp/xos_smoke.txt
            exit 1
          fi
          echo "shell smoke testi geçti (rc=$rc)"

  iso-config-check:
    name: ISO yapılandırma denetimi
    runs-on: ubuntu-24.04
    # Ubuntu'nun live-build fork'u (3.0~a57, 2013) bayrakları tanımıyor;
    # Debian'ın güncel live-build'ı ile container içinde denetliyoruz.
    container: debian:trixie
    needs: lint-and-test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: live-build kur & config çalıştır
        env:
          GH_TOKEN: ${{ github.token }}
          XOS_REPO: ${{ github.repository }}
          XOS_LOG_ISSUE: 2
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build curl jq bash
          . .github/workflows/xos-log.sh
          set +e
          {
            cd system/live-build &&
            ./auto/config &&
            test -e .build/config
          } > /tmp/xos_iso.txt 2>&1
          rc=$?
          set -e
          echo "--- iso config çıktısı (rc=$rc) ---"
          tail -n 80 /tmp/xos_iso.txt || true
          if [ "$rc" -ne 0 ]; then
            size=$(wc -c < /tmp/xos_iso.txt | tr -d ' ')
            echo "::error::META rc=$rc size=$size"
            joined=$(tail -n 40 /tmp/xos_iso.txt | sed -e 's/%/%%/g' \
              | awk 'BEGIN{f=1}{if(!f)printf "%%0A"; printf "%s",$0; f=0}')
            echo "::error::JOINED ${joined}"
            xos_post_log "ISO config rc=$rc" /tmp/xos_iso.txt
            exit "$rc"
          fi

  build-iso:
    # X-OS canlı ISO'su → CI artifact'ı.
    # Not: live-build chroot/mount için privileged container gerektirir;
    # Ubuntu runner'ının live-build fork'u bayrakları tanımadığı için
    # Debian trixie container'ında çalışır.
    name: X-OS canlı ISO (artifact)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: lint-and-test
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: live-build kur
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build curl jq bash ca-certificates
          # Paket adı probu (host trixie apt = aynı arşivler): hata anında
          # logun sonuna eklenip issue yorumuna düşer.
          for pk in kwin kwin-wayland qt6-base qt6-declarative qt6-multimedia \
                    spectacle qt6-wayland layer-shell-qt qml6-module-qtquick; do
            if apt-cache show "$pk" >/dev/null 2>&1; then echo "VAR  $pk"; else echo "YOK  $pk"; fi
          done > /tmp/xos_pkg_probe.txt 2>&1 || true
      - name: ISO üret
        env:
          GH_TOKEN: ${{ github.token }}
          XOS_REPO: ${{ github.repository }}
          XOS_LOG_ISSUE: 2
        run: |
          . .github/workflows/xos-log.sh
          set +e
          ./system/build-iso.sh > /tmp/xos_iso_build.txt 2>&1
          rc=$?
          set -e
          tail -n 40 /tmp/xos_iso_build.txt || true
          if [ "$rc" -ne 0 ]; then
            # OOM/killed kanıtı için dmesg de topla (privileged konteyner)
            dmesg 2>/dev/null | tail -n 40 > /tmp/xos_dmesg.txt || true
            cat /tmp/xos_iso_build.txt > /tmp/xos_iso_dmesg.txt
            { echo "--- dmesg tail ---"; cat /tmp/xos_dmesg.txt 2>/dev/null; } >> /tmp/xos_iso_dmesg.txt
            { echo "--- paket adı probu ---"; cat /tmp/xos_pkg_probe.txt 2>/dev/null; } >> /tmp/xos_iso_dmesg.txt
            echo "::error::ISO üretimi başarısız (rc=$rc)"
            joined=$(tail -n 80 /tmp/xos_iso_dmesg.txt \
              | sed -e 's/%/%%/g' | awk 'BEGIN{f=1}{if(!f)printf "%%0A"; printf "%s",$0; f=0}')
            echo "::error::ISO ${joined}"
            xos_post_log "ISO build rc=$rc" /tmp/xos_iso_dmesg.txt
            exit "$rc"
          fi
      - name: ISO doğrula & özet
        run: |
          set -e
          iso=$(find out/iso -maxdepth 1 -name '*.iso' | head -1)
          test -n "$iso"
          size=$(stat -c %s "$iso")
          # gerçekçi alt sınır: 400 MB
          test "$size" -gt 419430400
          sha=$(sha256sum "$iso" | cut -d' ' -f1)
          echo "ISO=$iso" >> "$GITHUB_STEP_SUMMARY"
          echo "Boyut: $(numfmt --to=iec $size)" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "✓ $(basename "$iso") — $size bayt — sha256 $sha"
      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: xos-live-iso
          path: out/iso/
          retention-days: 14
          if-no-files-found: error
