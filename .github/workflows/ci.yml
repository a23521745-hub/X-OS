name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  lint-and-test:
    name: Lint & testler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Token senkronizasyonu
        run: python3 tools/gen-tokens.py --check
      - name: QML yapısal lint
        run: python3 tools/qml-lint.py
      - name: Test paketi
        run: python3 tools/run_tests.py

  build-shell:
    name: plasmex derlemesi (Debian trixie, Qt6)
    runs-on: ubuntu-24.04
    container: debian:trixie
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
            liblayershellqtinterface-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-shapes \
            qml6-module-qtquick-effects qml6-module-qtquick-window \
            libgl1 libegl1 libglx0 libgl1-mesa-dri libegl-mesa0 \
            libxkbcommon0 libdbus-1-3
      - name: Yapılandır & derle
        run: |
          set +e
          {
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build -j"$(nproc)"
          } > /tmp/xos_build.txt 2>&1
          rc=$?
          set -e
          cat /tmp/xos_build.txt
          if [ "$rc" -ne 0 ]; then
            # Log indirilemediği için çıktıyı annotation olarak yayınla.
            echo "::error::plasmex build başarısız (rc=$rc). Çıktının son 60 satırı:"
            tail -n 60 /tmp/xos_build.txt | while IFS= read -r line; do
              line=${line//%/%%}
              echo "::error::${line}"
            done
          fi
          exit $rc
      - name: QML kaynaklarını doğrula (qmllint)
        run: |
          if command -v qmllint >/dev/null 2>&1; then
            qmllint shell/qml/Main.qml shell/qml/PlasmaX/*.qml \
              shell/qml/PlasmaX/components/*.qml shell/qml/PlasmaX/panels/*.qml \
              shell/qml/PlasmaX/services/*.qml || true
          fi
      - name: Smoke test (offscreen, yazılım GL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 ./build/plasmex --demo --preview 1280x800 \
            > /tmp/xos_smoke.txt 2>&1
          rc=$?
          set -e
          cat /tmp/xos_smoke.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::smoke test başarısız (rc=$rc):"
            tail -n 40 /tmp/xos_smoke.txt | while IFS= read -r line; do
              line=${line//%/%%}
              echo "::error::${line}"
            done
            exit 1
          fi
          echo "shell smoke testi geçti (rc=$rc)"

  iso-config-check:
    name: ISO yapılandırma denetimi
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: live-build kur & config çalıştır
        run: |
          set +e
          {
            sudo apt-get update &&
            sudo apt-get install -y live-build &&
            cd system/live-build &&
            ./auto/config &&
            test -e .build/config
          } > /tmp/xos_iso.txt 2>&1
          rc=$?
          set -e
          cat /tmp/xos_iso.txt
          if [ "$rc" -ne 0 ]; then
            echo "::error::ISO config denetimi başarısız (rc=$rc). Çıktı:"
            tail -n 60 /tmp/xos_iso.txt | while IFS= read -r line; do
              line=${line//%/%%}
              echo "::error::${line}"
            done
          fi
          exit $rc
