<svg xmlns="http://www.w3.org/2000/svg" width="456" height="24" viewBox="0 0 456 24" fill="none">
  <!-- X-OS icon sprite — 19 symbols on a 24 px grid, 1.5 px strokes.
       Order MUST match IconGlyph.names in shell/qml/PlasmaX/components/IconGlyph.qml
       0 launcher  1 wifi  2 volume  3 battery  4 shield  5 bell
       6 search  7 settings  8 power  9 lock  10 clock  11 media
       12 grid  13 sticker  14 sun  15 moon  16 chevron  17 close  18 xos -->
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 0 launcher: four-point diamond constellation -->
    <g transform="translate(0,0)"><path d="M12 4l3 8-3 8-3-8z"/><path d="M4 12l8-3 8 3-8 3z"/></g>
    <!-- 1 wifi -->
    <g transform="translate(24,0)"><path d="M3 9c5-4.5 13-4.5 18 0"/><path d="M6.5 13c3.2-2.8 7.8-2.8 11 0"/><path d="M12 18.5v.01"/></g>
    <!-- 2 volume -->
    <g transform="translate(48,0)"><path d="M4 10h3l4-4v12l-4-4H4z"/><path d="M15 9c1.5 1.8 1.5 4.2 0 6"/><path d="M17.5 6.5c3 3.2 3 7.8 0 11"/></g>
    <!-- 3 battery -->
    <g transform="translate(72,0)"><rect x="3" y="8" width="15" height="8" rx="2.5"/><path d="M21 11v2"/><path d="M6.5 11.5h4l-1 2.5h4"/></g>
    <!-- 4 shield -->
    <g transform="translate(96,0)"><path d="M12 3.5l7 2.5v5c0 4.5-3 7.5-7 9.5-4-2-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4.5"/></g>
    <!-- 5 bell -->
    <g transform="translate(120,0)"><path d="M6 16c1-1 1.5-2 1.5-4.5V10a4.5 4.5 0 019 0v1.5c0 2.5.5 3.5 1.5 4.5z"/><path d="M10.5 19a1.8 1.8 0 003 0"/></g>
    <!-- 6 search -->
    <g transform="translate(144,0)"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g>
    <!-- 7 settings: gear as ring + spokes -->
    <g transform="translate(168,0)"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2.1 2.1M15.9 15.9L18 18M18 6l-2.1 2.1M8.1 15.9L6 18"/></g>
    <!-- 8 power -->
    <g transform="translate(192,0)"><path d="M12 3.5v7"/><path d="M7.5 6.5a7 7 0 109 0"/></g>
    <!-- 9 lock -->
    <g transform="translate(216,0)"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/><path d="M12 14.5v2"/></g>
    <!-- 10 clock -->
    <g transform="translate(240,0)"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></g>
    <!-- 11 media: play/pause in ring -->
    <g transform="translate(264,0)"><circle cx="12" cy="12" r="8"/><path d="M10 8.8l5 3.2-5 3.2z"/></g>
    <!-- 12 grid -->
    <g transform="translate(288,0)"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></g>
    <!-- 13 sticker: peel corner -->
    <g transform="translate(312,0)"><path d="M5 5h9l5 5v9H5z"/><path d="M14 5v5h5"/><path d="M8.5 14.5c1.5 1.5 4 1.5 5.5 0"/></g>
    <!-- 14 sun -->
    <g transform="translate(336,0)"><circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></g>
    <!-- 15 moon -->
    <g transform="translate(360,0)"><path d="M19 14.5A8 8 0 019.5 5 8.2 8.2 0 1019 14.5z"/></g>
    <!-- 16 chevron -->
    <g transform="translate(384,0)"><path d="M9 6l6 6-6 6"/></g>
    <!-- 17 close -->
    <g transform="translate(408,0)"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></g>
    <!-- 18 xos: monogram X in rounded square -->
    <g transform="translate(432,0)"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></g>
  </g>
</svg>
